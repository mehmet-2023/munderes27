<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>MUNDERES'27</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: "MS Sans Serif", Tahoma, sans-serif; touch-action: none; }
        #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            display: none;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        #crosshair.active {
            background-color: #00ffcc;
            transform: translate(-50%, -50%) scale(1.4);
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #008080;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.25s ease;
        }

        .win-panel {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 12px;
            width: 320px;
            box-shadow: inset 1px 1px 0px #dfdfdf, 2px 2px 8px rgba(0,0,0,0.4);
        }

        .win-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            padding: 3px 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .win-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .win-text {
            font-size: 12px;
            color: #000000;
        }

        .win-progress-border {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background-color: #ffffff;
            padding: 2px;
            height: 18px;
        }

        .win-progress-fill {
            height: 100%;
            width: 0%;
            background-color: #000080;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>
    <div id="loader-overlay">
        <div class="win-panel">
            <div class="win-titlebar">Welcome To MUNDERES'27!</div>
            <div class="win-content">
                <div class="win-text" id="loader-text">Loading website...</div>
                <div class="win-progress-border">
                    <div class="win-progress-fill" id="loader-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    <canvas id="canvas"></canvas>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.153.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.153.0/examples/jsm/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'https://unpkg.com/three@0.153.0/examples/jsm/loaders/DRACOLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.153.0/examples/jsm/controls/OrbitControls.js';

        const canvas = document.getElementById('canvas');
        const crosshair = document.getElementById('crosshair');
        const loaderOverlay = document.getElementById('loader-overlay');
        const loaderBar = document.getElementById('loader-bar');
        const loaderText = document.getElementById('loader-text');

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x202020);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enabled = false;

        const raycaster = new THREE.Raycaster();
        const centerVector = new THREE.Vector2(0, 0);

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        let simulatedPercent = 0;
        let progressInterval = null;
        let isModelLoaded = false;

        function startSimulatedProgress() {
            simulatedPercent = 0;
            loaderBar.style.width = '0%';
            loaderText.textContent = 'Loading website (0%)...';
            clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                if (!isModelLoaded) {
                    if (simulatedPercent < 70) {
                        simulatedPercent += Math.floor(Math.random() * 4) + 2;
                    } else if (simulatedPercent < 90) {
                        simulatedPercent += Math.floor(Math.random() * 2) + 1;
                    } else if (simulatedPercent < 98) {
                        simulatedPercent += 1;
                    }
                } else {
                    simulatedPercent = 100;
                }

                if (simulatedPercent > 100) simulatedPercent = 100;
                loaderBar.style.width = simulatedPercent + '%';
                loaderText.textContent = `Loading website (${simulatedPercent}%)...`;

                if (simulatedPercent >= 100) {
                    clearInterval(progressInterval);
                    if (isModelLoaded) {
                        loaderText.textContent = 'Initializing scene...';
                        setTimeout(() => {
                            loaderOverlay.style.opacity = '0';
                            setTimeout(() => {
                                loaderOverlay.style.display = 'none';
                            }, 250);
                        }, 200);
                    }
                }
            }, 80);
        }

        function completeSimulatedProgress() {
            isModelLoaded = true;
            if (simulatedPercent < 99) {
                simulatedPercent = 100;
                loaderBar.style.width = '100%';
                loaderText.textContent = 'Loading website (100%)...';
            }
        }

        function logCamera() {
            console.log(`Camera Pos: x=${camera.position.x.toFixed(3)}, y=${camera.position.y.toFixed(3)}, z=${camera.position.z.toFixed(3)} | Distance: ${spherical.radius.toFixed(3)}`);
        }

        function checkHover() {
            if (!isMobile && document.pointerLockElement !== canvas) return;
            
            raycaster.setFromCamera(centerVector, camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            if (hits.length > 0) {
                crosshair.classList.add('active');
            } else {
                crosshair.classList.remove('active');
            }
        }

        renderer.domElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            logCamera();
        });

        renderer.domElement.addEventListener('click', () => {
            if (isMobile) return;
            if (document.pointerLockElement !== canvas) {
                canvas.requestPointerLock();
                return;
            }

            raycaster.setFromCamera(centerVector, camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            if (hits.length > 0) {
                const obj = hits[0].object;
                let name = obj.name;
                if (!name) {
                    let p = obj.parent;
                    while (p && !name) { name = p.name; p = p.parent; }
                }
                const pt = hits[0].point;
                console.log(`Clicked Object: ${name || '(unnamed)'} | Point: x=${pt.x.toFixed(3)}, y=${pt.y.toFixed(3)}, z=${pt.z.toFixed(3)}`, obj);
            } else {
                console.log('Clicked empty space');
            }
        });

        const hemi = new THREE.HemisphereLight(0xfff3e0, 0x3d3228, 0.6);
        hemi.position.set(0, 20, 0);
        scene.add(hemi);

        const dir = new THREE.DirectionalLight(0xfff0d6, 0.7);
        dir.position.set(5, 10, 7.5);
        scene.add(dir);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        let lookTarget = new THREE.Vector3(0.063, 1.610, -1.099);
        const spherical = new THREE.Spherical();
        
        let initialTheta = 0;
        const maxThetaOffset = (150 * Math.PI / 180) / 2;
        let minTheta = -Infinity, maxTheta = Infinity;

        let minPhi = 0.01, maxPhi = Math.PI - 0.01;
        let minRadius = 0.5, maxRadius = 10.0;
        const lookSensitivity = isMobile ? 0.003 : 0.001;
        const zoomSensitivity = 0.001;

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function updateCameraFromSpherical() {
            const pos = new THREE.Vector3().setFromSpherical(spherical).add(lookTarget);
            camera.position.copy(pos);
            camera.lookAt(lookTarget);
            logCamera();
            checkHover();
        }

        function handleLookDelta(deltaX, deltaY) {
            spherical.theta -= deltaX * lookSensitivity;
            spherical.phi -= deltaY * lookSensitivity;
            spherical.theta = clamp(spherical.theta, minTheta, maxTheta);
            spherical.phi = clamp(spherical.phi, minPhi, maxPhi);
            updateCameraFromSpherical();
        }

        function onPointerMove(e) {
            if (document.pointerLockElement !== canvas) return;
            const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
            const movementY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
            handleLookDelta(movementX, movementY);
        }

        let touchStartX = 0;
        let touchStartY = 0;
        let isTouching = false;

        function onTouchStart(e) {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isTouching = true;
            }
        }

        function onTouchMove(e) {
            if (!isTouching || e.touches.length !== 1) return;
            e.preventDefault();
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            const deltaX = currentX - touchStartX;
            const deltaY = currentY - touchStartY;
            
            handleLookDelta(deltaX, deltaY);
            
            touchStartX = currentX;
            touchStartY = currentY;
        }

        function onTouchEnd() {
            isTouching = false;
        }

        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd);
        canvas.addEventListener('touchcancel', onTouchEnd);

        function onWheel(e) {
            if (!isMobile && document.pointerLockElement !== canvas) return;
            spherical.radius += e.deltaY * zoomSensitivity;
            spherical.radius = clamp(spherical.radius, minRadius, maxRadius);
            updateCameraFromSpherical();
        }

        window.addEventListener('wheel', onWheel, { passive: true });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvas) {
                document.addEventListener('mousemove', onPointerMove);
                crosshair.style.display = 'block';
                console.log('Pointer locked — mouselook enabled');
            } else {
                document.removeEventListener('mousemove', onPointerMove);
                crosshair.style.display = 'none';
                console.log('Pointer unlocked — mouselook disabled');
            }
        });

        function loadGLB(url) {
            const old = scene.getObjectByName('room-model');
            if (old) scene.remove(old);

            loaderOverlay.style.display = 'flex';
            loaderOverlay.style.opacity = '1';
            isModelLoaded = false;
            startSimulatedProgress();

            fetch(url, { method: 'GET' }).then(resp => {
                if (!resp.ok) {
                    console.error('Fetch error:', resp.status, resp.statusText);
                    clearInterval(progressInterval);
                    loaderText.textContent = 'Fetch failed.';
                    return;
                }
                loader.load(url,
                    function (gltf) {
                        const root = gltf.scene || gltf.scenes[0];
                        root.name = 'room-model';
                        scene.add(root);

                        lookTarget.set(0.063, 1.610, -1.099);
                        const posInit = new THREE.Vector3(2.859, 1.427, -1.192);

                        const posTop = new THREE.Vector3(2.859, 1.261, -1.192);
                        const posBottom = new THREE.Vector3(2.859, 2.766, -1.192);

                        const offInit = posInit.clone().sub(lookTarget);
                        spherical.setFromVector3(offInit);
                        
                        if (!isMobile) {
                            spherical.radius *= 0.6;
                        }

                        minRadius = spherical.radius * 0.3;
                        maxRadius = spherical.radius * 2.5;

                        initialTheta = spherical.theta;
                        minTheta = initialTheta - maxThetaOffset;
                        maxTheta = initialTheta + maxThetaOffset;

                        const offTop = posTop.clone().sub(lookTarget);
                        const offBottom = posBottom.clone().sub(lookTarget);

                        const sphTop = new THREE.Spherical().setFromVector3(offTop);
                        const sphBottom = new THREE.Spherical().setFromVector3(offBottom);

                        minPhi = Math.min(sphTop.phi, sphBottom.phi);
                        maxPhi = Math.max(sphTop.phi, sphBottom.phi);

                        updateCameraFromSpherical();
                        console.log('GLB successfully loaded');

                        completeSimulatedProgress();
                    },
                    undefined,
                    function (err) {
                        console.error('GLB Loader Error:', err);
                        clearInterval(progressInterval);
                        loaderText.textContent = 'Error loading model.';
                    }
                );
            }).catch(err => {
                console.error('Network Error:', err);
                clearInterval(progressInterval);
                loaderText.textContent = 'Network error.';
            });
        }

        loadGLB('room.glb');

        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', async e => {
            e.preventDefault();
            const f = e.dataTransfer.files[0];
            if (!f) return;
            const url = URL.createObjectURL(f);
            await loadGLB(url);
            URL.revokeObjectURL(url);
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
