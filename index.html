<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>MUNDERES'27</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: "MS Sans Serif", Tahoma, sans-serif; touch-action: none; }
        #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            display: none;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        #crosshair.active {
            background-color: #ff3333;
            transform: translate(-50%, -50%) scale(1.4);
        }

        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #008080;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.25s ease;
        }

        .win-panel {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 12px;
            width: 320px;
            box-shadow: inset 1px 1px 0px #dfdfdf, 2px 2px 8px rgba(0,0,0,0.4);
        }

        .win-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            padding: 3px 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .win-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .win-text {
            font-size: 12px;
            color: #000000;
        }

        .win-progress-border {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            background-color: #ffffff;
            padding: 2px;
            height: 18px;
        }

        .win-progress-fill {
            height: 100%;
            width: 0%;
            background-color: #000080;
            transition: width 0.1s linear;
        }

        #typing-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 128, 128, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9000;
            padding: 20px;
            box-sizing: border-box;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .win-intro-dialog {
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 3px;
            width: 90%;
            max-width: 640px;
            box-shadow: inset 1px 1px 0px #dfdfdf, 6px 6px 16px rgba(0,0,0,0.6);
        }

        .win-intro-body {
            background: #ffffff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #dfdfdf;
            border-bottom: 2px solid #dfdfdf;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #intro-title {
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            font-size: clamp(18px, 3vw, 26px);
            font-weight: bold;
            color: #000080;
            margin: 0;
            white-space: nowrap;
            letter-spacing: 0.5px;
            text-align: center;
        }

        #intro-body {
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            font-size: clamp(12px, 1.5vw, 15px);
            color: #000000;
            margin: 0;
            line-height: 1.5;
            min-height: 50px;
            text-align: center;
        }

        #typing-cursor {
            display: inline-block;
            width: 7px;
            height: 1.1em;
            background-color: #000000;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #skip-prompt {
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 6px 20px;
            margin-top: 8px;
            cursor: pointer;
            box-shadow: active 1px 1px 0px #000;
        }

        #skip-prompt:active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 7px 19px 5px 21px;
        }

        #pc-subtitle {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            font-family: "MS Sans Serif", Tahoma, sans-serif;
            font-size: clamp(12px, 1.5vw, 14px);
            color: #000000;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            padding: 8px 18px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            z-index: 100;
            display: none;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        #win98-os-overlay {
            position: fixed;
            top: 2.5vh;
            left: 2.5vw;
            width: 95vw;
            height: 95vh;
            background-color: #008080;
            z-index: 99999;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 3px solid #c0c0c0;
            overflow: hidden;
            user-select: none;
        }

        #win98-boot-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        #win98-boot-logo {
            max-width: 280px;
            opacity: 0;
            transition: opacity 1.8s ease;
        }

        #win98-desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #008080;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1;
        }

        .win98-desktop-icons {
            position: relative;
            width: 100%;
            height: calc(100% - 40px);
            box-sizing: border-box;
            overflow: hidden;
        }

        .win98-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 85px;
            cursor: pointer;
            padding: 4px;
            border: 1px transparent dotted;
            box-sizing: border-box;
        }

        .win98-icon:hover {
            background-color: rgba(0, 0, 128, 0.2);
        }

        .win98-icon.selected {
            background-color: #000080;
            border-color: #ffffff;
        }

        .win98-icon.selected .win98-icon-text {
            background-color: #000080;
            color: #ffffff;
        }

        .win98-icon-svg {
            width: 32px;
            height: 32px;
            margin-bottom: 4px;
            filter: drop-shadow(1px 1px 0px rgba(0,0,0,0.5));
        }

        .win98-icon-text {
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            text-shadow: 1px 1px 1px #000;
            line-height: 1.2;
            word-wrap: break-word;
            max-width: 100%;
            padding: 1px 2px;
        }

        .win98-window {
            position: absolute;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            min-width: 250px;
            min-height: 150px;
            z-index: 10;
        }

        .win98-window-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: #ffffff;
            font-weight: bold;
            font-size: 12px;
            padding: 3px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: move;
        }

        .win98-window-titlebar.inactive {
            background: linear-gradient(90deg, #808080, #b5b5b5);
        }

        .win98-window-title-text {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .win98-window-controls {
            display: flex;
            gap: 2px;
        }

        .win98-win-btn {
            width: 16px;
            height: 14px;
            background-color: #c0c0c0;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }

        .win98-win-btn:active {
            border-top: 1px solid #000000;
            border-left: 1px solid #000000;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding-top: 1px;
            padding-left: 1px;
        }

        .win98-window-content {
            flex: 1;
            padding: 10px;
            background-color: #c0c0c0;
            overflow: auto;
            font-size: 12px;
        }

        .win98-taskbar {
            height: 30px;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .win98-taskbar-left {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 100%;
            flex: 1;
            overflow: hidden;
        }

        .win98-start-btn {
            height: 22px;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            font-weight: bold;
            font-size: 11px;
            padding: 0 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .win98-start-btn:active, .win98-start-btn.active {
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            padding: 1px 5px -1px 7px;
        }

        .win98-taskbar-tasks {
            display: flex;
            gap: 3px;
            overflow-x: auto;
            flex: 1;
            height: 100%;
        }

        .win98-task-item {
            height: 22px;
            min-width: 100px;
            max-width: 160px;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            font-size: 11px;
            padding: 0 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .win98-task-item.active {
            background-color: #e0e0e0;
            border-top: 2px solid #000000;
            border-left: 2px solid #000000;
            border-right: 2px solid #ffffff;
            border-bottom: 2px solid #ffffff;
            font-weight: bold;
        }

        .win98-tray {
            height: 22px;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
            padding: 0 6px;
            display: flex;
            align-items: center;
            font-size: 11px;
            background-color: #c0c0c0;
        }

        .win98-start-menu {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 180px;
            background-color: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-right: 2px solid #000000;
            border-bottom: 2px solid #000000;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            display: none;
            flex-direction: row;
            z-index: 1001;
        }

        .win98-start-sidebar {
            width: 24px;
            background: linear-gradient(0deg, #000080, #1084d0);
            color: #ffffff;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 8px 2px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .win98-start-items {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2px 0;
        }

        .win98-start-item {
            padding: 6px 10px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .win98-start-item:hover {
            background-color: #000080;
            color: #ffffff;
        }

        .win98-start-divider {
            height: 1px;
            border-top: 1px solid #808080;
            border-bottom: 1px solid #ffffff;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div id="loader-overlay">
        <div class="win-panel">
            <div class="win-titlebar">Welcome To MUNDERES'27!</div>
            <div class="win-content">
                <div class="win-text" id="loader-text">Loading website...</div>
                <div class="win-progress-border">
                    <div class="win-progress-fill" id="loader-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="typing-overlay">
        <div class="win-intro-dialog">
            <div class="win-titlebar">System Announcement - MUNDERES'27</div>
            <div class="win-intro-body">
                <h1 id="intro-title">Welcome to MUNDERES'27</h1>
                <p id="intro-body"><span id="typed-content"></span><span id="typing-cursor"></span></p>
                <button id="skip-prompt">Click anywhere to enter</button>
            </div>
        </div>
    </div>

    <div id="pc-subtitle">Click on the computer to enter the website</div>
    <div id="crosshair"></div>
    <canvas id="canvas"></canvas>

    <div id="win98-os-overlay">
        <div id="win98-boot-screen">
            <img id="win98-boot-logo" src="logo.png" alt="Windows Logo" />
        </div>
        <div id="win98-desktop">
            <div class="win98-desktop-icons" id="desktop-icons-container"></div>
            
            <div class="win98-start-menu" id="start-menu">
                <div class="win98-start-sidebar">Munderes'27</div>
                <div class="win98-start-items" id="start-menu-items"></div>
            </div>

            <div class="win98-taskbar">
                <div class="win98-taskbar-left">
                    <div class="win98-start-btn" id="start-btn">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                            <rect x="1" y="1" width="6" height="6" fill="#ff0000"/>
                            <rect x="8" y="1" width="6" height="6" fill="#00ff00"/>
                            <rect x="1" y="8" width="6" height="6" fill="#0000ff"/>
                            <rect x="8" y="8" width="6" height="6" fill="#ffff00"/>
                        </svg>
                        <strong>Start</strong>
                    </div>
                    <div class="win98-taskbar-tasks" id="taskbar-tasks"></div>
                </div>
                <div class="win98-tray" id="tray-clock">12:00 PM</div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.153.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'https://unpkg.com/three@0.153.0/examples/jsm/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'https://unpkg.com/three@0.153.0/examples/jsm/loaders/DRACOLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.153.0/examples/jsm/controls/OrbitControls.js';

        const canvas = document.getElementById('canvas');
        const crosshair = document.getElementById('crosshair');
        const loaderOverlay = document.getElementById('loader-overlay');
        const loaderBar = document.getElementById('loader-bar');
        const loaderText = document.getElementById('loader-text');
        const typingOverlay = document.getElementById('typing-overlay');
        const typedContent = document.getElementById('typed-content');
        const pcSubtitle = document.getElementById('pc-subtitle');

        const win98Overlay = document.getElementById('win98-os-overlay');
        const win98BootScreen = document.getElementById('win98-boot-screen');
        const win98BootLogo = document.getElementById('win98-boot-logo');

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x202020);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enabled = false;

        const raycaster = new THREE.Raycaster();
        const centerVector = new THREE.Vector2(0, 0);

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;

        let simulatedPercent = 0;
        let progressInterval = null;
        let isModelLoaded = false;

        let targetObjects = [];
        let isPcClicked = false;
        let typingIndex = 0;
        let typingTimeout = null;
        const fullMessage = "Click the computer to enter the website. You can also wander around and find easter eggs.";

        let isAnimatingCamera = false;
        let animStartTime = 0;
        const animDuration = 1800;
        let startCamPos = new THREE.Vector3();
        let startLookTarget = new THREE.Vector3();
        const targetCamPos = new THREE.Vector3(-2.303, 1.149, -0.745);
        const targetLookTarget = new THREE.Vector3(-1.727, 0.954, 0.049);
        let osOpened = false;

        function startSimulatedProgress() {
            simulatedPercent = 0;
            loaderBar.style.width = '0%';
            loaderText.textContent = 'Loading website (0%)...';
            clearInterval(progressInterval);

            progressInterval = setInterval(() => {
                if (!isModelLoaded) {
                    if (simulatedPercent < 70) {
                        simulatedPercent += Math.floor(Math.random() * 4) + 2;
                    } else if (simulatedPercent < 90) {
                        simulatedPercent += Math.floor(Math.random() * 2) + 1;
                    } else if (simulatedPercent < 98) {
                        simulatedPercent += 1;
                    }
                } else {
                    simulatedPercent = 100;
                }

                if (simulatedPercent > 100) simulatedPercent = 100;
                loaderBar.style.width = simulatedPercent + '%';
                loaderText.textContent = `Loading website (${simulatedPercent}%)...`;

                if (simulatedPercent >= 100) {
                    clearInterval(progressInterval);
                    if (isModelLoaded) {
                        loaderText.textContent = 'Initializing scene...';
                        setTimeout(() => {
                            loaderOverlay.style.opacity = '0';
                            setTimeout(() => {
                                loaderOverlay.style.display = 'none';
                                startIntroSequence();
                            }, 250);
                        }, 200);
                    }
                }
            }, 80);
        }

        function completeSimulatedProgress() {
            isModelLoaded = true;
            if (simulatedPercent < 99) {
                simulatedPercent = 100;
                loaderBar.style.width = '100%';
                loaderText.textContent = 'Loading website (100%)...';
            }
        }

        function startIntroSequence() {
            typingOverlay.style.display = 'flex';
            setTimeout(() => {
                typingOverlay.style.opacity = '1';
                typeWriter();
            }, 50);
        }

        function typeWriter() {
            if (typingIndex < fullMessage.length) {
                typedContent.textContent += fullMessage.charAt(typingIndex);
                typingIndex++;
                typingTimeout = setTimeout(typeWriter, 35);
            }
        }

        function closeTypingOverlay() {
            if (typingOverlay.style.display === 'none') return;
            clearTimeout(typingTimeout);
            typedContent.textContent = fullMessage;
            typingOverlay.style.opacity = '0';
            setTimeout(() => {
                typingOverlay.style.display = 'none';
                if (!isPcClicked) {
                    pcSubtitle.style.display = 'block';
                }
                if (!isMobile && document.pointerLockElement !== canvas) {
                    canvas.requestPointerLock();
                }
            }, 300);
        }

        typingOverlay.addEventListener('click', closeTypingOverlay);

        function checkHover() {
            if (!isMobile && document.pointerLockElement !== canvas) return;
            
            raycaster.setFromCamera(centerVector, camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            if (hits.length > 0) {
                crosshair.classList.add('active');
            } else {
                crosshair.classList.remove('active');
            }
        }

        function triggerWin98OS() {
            if (document.pointerLockElement) {
                document.exitPointerLock();
            }
            win98Overlay.style.display = 'block';
            setTimeout(() => {
                win98Overlay.style.opacity = '1';
            }, 50);

            setTimeout(() => {
                win98BootLogo.style.opacity = '1';
            }, 400);

            setTimeout(() => {
                win98BootLogo.style.opacity = '0';
            }, 4500);

            setTimeout(() => {
                win98BootScreen.style.transition = 'opacity 1.5s ease';
                win98BootScreen.style.opacity = '0';
                setTimeout(() => {
                    win98BootScreen.style.display = 'none';
                }, 1500);
            }, 6200);
        }

        function startCameraAnimation() {
            startCamPos.copy(camera.position);
            startLookTarget.copy(lookTarget);
            animStartTime = performance.now();
            isAnimatingCamera = true;
            osOpened = false;
        }

        renderer.domElement.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        renderer.domElement.addEventListener('click', () => {
            if (isMobile) return;
            if (document.pointerLockElement !== canvas && !isPcClicked) {
                canvas.requestPointerLock();
                return;
            }

            raycaster.setFromCamera(centerVector, camera);
            const hits = raycaster.intersectObjects(scene.children, true);

            if (hits.length > 0) {
                const obj = hits[0].object;
                let isTarget = false;

                let curr = obj;
                if (curr.name === "one_lp_lambert1_0") isTarget = true;
                while (curr.parent && !isTarget) {
                    curr = curr.parent;
                    if (curr.name === "one_lp_lambert1_0") isTarget = true;
                }

                if (isTarget && !isPcClicked) {
                    isPcClicked = true;
                    pcSubtitle.style.display = 'none';
                    startCameraAnimation();
                }
            }
        });

        const hemi = new THREE.HemisphereLight(0xfff3e0, 0x3d3228, 0.6);
        hemi.position.set(0, 20, 0);
        scene.add(hemi);

        const dir = new THREE.DirectionalLight(0xfff0d6, 0.7);
        dir.position.set(5, 10, 7.5);
        scene.add(dir);

        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        let lookTarget = new THREE.Vector3(0.063, 1.610, -1.099);
        const spherical = new THREE.Spherical();
        
        let initialTheta = 0;
        const maxThetaOffset = (150 * Math.PI / 180) / 2;
        let minTheta = -Infinity, maxTheta = Infinity;

        let minPhi = 0.01, maxPhi = Math.PI - 0.01;
        let minRadius = 0.5, maxRadius = 10.0;
        const lookSensitivity = isMobile ? 0.003 : 0.001;
        const zoomSensitivity = 0.001;

        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function updateCameraFromSpherical() {
            if (isAnimatingCamera) return;
            const pos = new THREE.Vector3().setFromSpherical(spherical).add(lookTarget);
            camera.position.copy(pos);
            camera.lookAt(lookTarget);
            checkHover();
        }

        function handleLookDelta(deltaX, deltaY) {
            if (isAnimatingCamera) return;
            spherical.theta -= deltaX * lookSensitivity;
            spherical.phi -= deltaY * lookSensitivity;
            spherical.theta = clamp(spherical.theta, minTheta, maxTheta);
            spherical.phi = clamp(spherical.phi, minPhi, maxPhi);
            updateCameraFromSpherical();
        }

        function onPointerMove(e) {
            if (document.pointerLockElement !== canvas) return;
            const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
            const movementY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;
            handleLookDelta(movementX, movementY);
        }

        let touchStartX = 0;
        let touchStartY = 0;
        let isTouching = false;

        function onTouchStart(e) {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                isTouching = true;
            }
        }

        function onTouchMove(e) {
            if (!isTouching || e.touches.length !== 1) return;
            e.preventDefault();
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            
            const deltaX = currentX - touchStartX;
            const deltaY = currentY - touchStartY;
            
            handleLookDelta(deltaX, deltaY);
            
            touchStartX = currentX;
            touchStartY = currentY;
        }

        function onTouchEnd() {
            isTouching = false;
        }

        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        canvas.addEventListener('touchmove', onTouchMove, { passive: false });
        canvas.addEventListener('touchend', onTouchEnd);
        canvas.addEventListener('touchcancel', onTouchEnd);

        function onWheel(e) {
            if (!isMobile && document.pointerLockElement !== canvas) return;
            spherical.radius += e.deltaY * zoomSensitivity;
            spherical.radius = clamp(spherical.radius, minRadius, maxRadius);
            updateCameraFromSpherical();
        }

        window.addEventListener('wheel', onWheel, { passive: true });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === canvas) {
                document.addEventListener('mousemove', onPointerMove);
                crosshair.style.display = 'block';
            } else {
                document.removeEventListener('mousemove', onPointerMove);
                crosshair.style.display = 'none';
            }
        });

        function setupTargetMeshGlow(root) {
            targetObjects = [];
            root.traverse((child) => {
                if (child.name === 'one_lp_lambert1_0' || (child.parent && child.parent.name === 'one_lp_lambert1_0')) {
                    if (child.isMesh) {
                        const newMat = new THREE.MeshStandardMaterial({
                            color: child.material.color ? child.material.color.clone() : new THREE.Color(0xffffff),
                            map: child.material.map || null,
                            roughness: child.material.roughness !== undefined ? child.material.roughness : 0.5,
                            metalness: child.material.metalness !== undefined ? child.material.metalness : 0.1,
                            emissive: new THREE.Color(0xff2222),
                            emissiveIntensity: 0
                        });
                        child.material = newMat;
                        targetObjects.push(child);
                    }
                }
            });
        }

        function loadGLB(url) {
            const old = scene.getObjectByName('room-model');
            if (old) scene.remove(old);

            loaderOverlay.style.display = 'flex';
            loaderOverlay.style.opacity = '1';
            isModelLoaded = false;
            targetObjects = [];
            isPcClicked = false;
            startSimulatedProgress();

            fetch(url, { method: 'GET' }).then(resp => {
                if (!resp.ok) {
                    clearInterval(progressInterval);
                    loaderText.textContent = 'Fetch failed.';
                    return;
                }
                loader.load(url,
                    function (gltf) {
                        const root = gltf.scene || gltf.scenes[0];
                        root.name = 'room-model';
                        scene.add(root);

                        setupTargetMeshGlow(root);

                        lookTarget.set(0.063, 1.610, -1.099);
                        const posInit = new THREE.Vector3(2.859, 1.427, -1.192);

                        const posTop = new THREE.Vector3(2.859, 1.3, -1.192);
                        const posBottom = new THREE.Vector3(2.859, 2.766, -1.192);

                        const offInit = posInit.clone().sub(lookTarget);
                        spherical.setFromVector3(offInit);
                        
                        if (!isMobile) {
                            spherical.radius *= 0.6;
                        }

                        minRadius = spherical.radius * 0.3;
                        maxRadius = spherical.radius * 2.5;

                        initialTheta = spherical.theta;
                        minTheta = initialTheta - maxThetaOffset;
                        maxTheta = initialTheta + maxThetaOffset;

                        const offTop = posTop.clone().sub(lookTarget);
                        const offBottom = posBottom.clone().sub(lookTarget);

                        const sphTop = new THREE.Spherical().setFromVector3(offTop);
                        const sphBottom = new THREE.Spherical().setFromVector3(offBottom);

                        minPhi = Math.min(sphTop.phi, sphBottom.phi);
                        maxPhi = Math.max(sphTop.phi, sphBottom.phi);

                        updateCameraFromSpherical();
                        completeSimulatedProgress();
                    },
                    undefined,
                    function (err) {
                        clearInterval(progressInterval);
                        loaderText.textContent = 'Error loading model.';
                    }
                );
            }).catch(err => {
                clearInterval(progressInterval);
                loaderText.textContent = 'Network error.';
            });
        }

        loadGLB('room.glb');

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function animate(time) {
            requestAnimationFrame(animate);

            if (isAnimatingCamera) {
                const elapsed = time - animStartTime;
                let progress = elapsed / animDuration;

                if (progress >= 1) {
                    progress = 1;
                    isAnimatingCamera = false;
                }

                const easeProgress = easeInOutCubic(progress);

                camera.position.lerpVectors(startCamPos, targetCamPos, easeProgress);
                lookTarget.lerpVectors(startLookTarget, targetLookTarget, easeProgress);
                camera.lookAt(lookTarget);

                if (elapsed >= 1100 && !osOpened) {
                    osOpened = true;
                    triggerWin98OS();
                }
            }

            if (targetObjects.length > 0) {
                if (!isPcClicked) {
                    const glowIntensity = (Math.sin(time * 0.004) + 1) * 0.12 + 0.05;
                    targetObjects.forEach((mesh) => {
                        if (mesh.material && mesh.material.emissive) {
                            mesh.material.emissiveIntensity = glowIntensity;
                        }
                    });
                } else {
                    targetObjects.forEach((mesh) => {
                        if (mesh.material && mesh.material.emissive && mesh.material.emissiveIntensity !== 0) {
                            mesh.material.emissiveIntensity = 0;
                        }
                    });
                }
            }

            renderer.render(scene, camera);
        }
        animate(0);
    </script>

    <script src="os.js"></script>
</body>
</html>
